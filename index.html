<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teddy Day For Priya</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
}

/* Pages */
.page{
    display:none;
    height:100vh;
    width:100%;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:absolute;
}

.page.active{
    display:flex;
}

.card{
    background:white;
    padding:35px;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
    animation:pop 1s ease;
    z-index:2;
}

@keyframes pop{
    from{transform:scale(0.5);opacity:0;}
    to{transform:scale(1);opacity:1;}
}

h1,h2{
    color:#ff4d6d;
}

p{
    font-size:22px;
    margin:10px 0;
}

button{
    margin-top:20px;
    padding:12px 30px;
    border:none;
    border-radius:30px;
    background:#ff4d6d;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

/* Teddy bounce */
.teddy{
    font-size:90px;
    animation:bounce 2s infinite;
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-20px);}
}

/* Rain animation */
.rain{
    position:absolute;
    top:-50px;
    animation:fall linear infinite;
    opacity:0.8;
    z-index:1;
}

@keyframes fall{
    from{transform:translateY(-10vh);}
    to{transform:translateY(110vh);}
}
</style>
</head>
<body>

<!-- Page 1 -->
<div class="page active" id="page1">
    <div class="card">
        <h1>For You Priya 💖</h1>
        <p>Happy Teddy Day 🧸</p>
        <div class="teddy">🧸</div>
        <button onclick="nextPage(2)">Next 💕</button>
    </div>
</div>

<!-- Page 2 -->
<div class="page" id="page2" style="background:linear-gradient(135deg,#ff758c,#ff7eb3);">
    <div class="card">
        <h2>Just For You 💓</h2>
        <div class="teddy">🧸💞</div>
        <p>This teddy is full of love & hugs ✨</p>
        <button onclick="nextPage(3)">Last Surprise 💖</button>
    </div>
</div>

<!-- Page 3 -->
<div class="page" id="page3" style="background:linear-gradient(135deg,#f857a6,#ff5858);">
    <div class="card">
        <h1>I Love You Bestie 💓</h1>
        <div class="teddy">🧸💖</div>
        <p>You are very special to me ❤️</p>
    </div>
</div>

<script>
/* Page change */
function nextPage(page){
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page'+page).classList.add('active');
}

/* Heart + Teddy Rain */
const emojis = ["💓","💖","💞","🧸"];

function createRain(){
    const rain = document.createElement("div");
    rain.classList.add("rain");
    rain.innerText = emojis[Math.floor(Math.random()*emojis.length)];
    rain.style.left = Math.random()*100 + "vw";
    rain.style.fontSize = (20 + Math.random()*30) + "px";
    rain.style.animationDuration = (4 + Math.random()*4) + "s";

    document.body.appendChild(rain);

    setTimeout(()=>{ rain.remove(); },8000);
}

setInterval(createRain, 300);
</script>

</body>
</html>
